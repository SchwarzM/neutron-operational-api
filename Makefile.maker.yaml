metadata:
  url: https://github.com/SchwarzM/neutron-operational-api

binaries:
  - name: demo-ctl
    fromPackage: ./cmd/demo-ctl
    installTo: bin/
  - name: demo-server
    fromPackage: ./cmd/demo-server
    installTo: bin/
  - name: loadgen
    fromPackage: ./cmd/loadgen
    installTo: bin/

golang:
  setGoModVersion: true

golangciLint:
  createConfig: true

goReleaser:
  createConfig: true
  binaryName: demo-ctl
  format: .tar.gz
  files:
    - CHANGELOG.md
    - README.md

controllerGen:
  enabled: false

reuse:
  enabled: false

nix:
  enabled: false

githubWorkflow:
  global:
    defaultBranch: main
  ci:
    enabled: true
    ignorePaths:
      - "docs/**"
      - "*.md"
  pushContainerToGhcr:
    enabled: true
    platforms: "linux/amd64"
    tagStrategy: [edge, latest, semver, sha]
  release:
    enabled: true
  securityChecks:
    enabled: false
  license:
    enabled: false

verbatim: |
  CLUSTER_NAME  = k8s-readiness-demo
  IMAGE         = demo-server:local
  GHCR_IMAGE    = ghcr.io/schwarzm/neutron-operational-api:edge

  .PHONY: check-prereqs check-prereqs-quick demo demo-quick build-web build-image

  check-prereqs:
    @for tool in go docker kind; do \
      command -v $$tool >/dev/null 2>&1 || { \
        echo "missing prerequisite: $$tool"; \
        case $$tool in \
          go)     echo "  install: https://go.dev/dl/";; \
          docker) echo "  install: https://docs.docker.com/get-docker/";; \
          kind)   echo "  install: https://kind.sigs.k8s.io/docs/user/quick-start/#installation";; \
        esac; \
        exit 1; \
      }; \
    done

  check-prereqs-quick:
    @command -v kind >/dev/null 2>&1 || { \
      echo "missing prerequisite: kind"; \
      echo "  install: https://kind.sigs.k8s.io/docs/user/quick-start/#installation"; \
      exit 1; \
    }
    @test -x ./demo-ctl || { \
      echo "demo-ctl binary not found. Download it from:"; \
      echo "  https://github.com/SchwarzM/neutron-operational-api/releases/tag/edge"; \
      exit 1; \
    }

  build-web:
    docker run --rm \
      -v "$(CURDIR)/web:/app" \
      -w /app \
      node:lts-alpine \
      sh -c "npm install --prefer-offline && npm run build"

  build-image:
    docker build -t $(IMAGE) .
    -kind load docker-image $(IMAGE) --name $(CLUSTER_NAME) 2>/dev/null || true

  # Full build from source (requires Go, Docker, kind)
  demo: check-prereqs build-web build-image
    go run ./cmd/demo-ctl/

  # Quick start using pre-built binaries — demo-ctl pulls the image automatically (requires kind only)
  demo-quick: check-prereqs-quick
    ./demo-ctl
