metadata:
  url: https://github.com/SchwarzM/neutron-operational-api

binaries:
  - name: demo-ctl
    fromPackage: ./cmd/demo-ctl
    installTo: bin/
  - name: demo-server
    fromPackage: ./cmd/demo-server
    installTo: bin/

golang:
  setGoModVersion: true

golangciLint:
  createConfig: true

goReleaser:
  createConfig: true
  binaryName: demo-ctl
  format: .tar.gz

controllerGen:
  enabled: false

reuse:
  enabled: false

nix:
  enabled: false

githubWorkflow:
  global:
    defaultBranch: main
  ci:
    enabled: true
    ignorePaths:
      - "docs/**"
      - "*.md"
  pushContainerToGhcr:
    enabled: true
    platforms: "linux/amd64,linux/arm64"
    tagStrategy: [edge, latest, semver, sha]
  release:
    enabled: true
  securityChecks:
    enabled: false
  license:
    enabled: false

verbatim: |
  CLUSTER_NAME = k8s-readiness-demo
  IMAGE        = demo-server:local

  .PHONY: check-prereqs demo build-web build-image

  check-prereqs:
    @for tool in go docker kind; do \
      command -v $$tool >/dev/null 2>&1 || { \
        echo "missing prerequisite: $$tool"; \
        case $$tool in \
          go)     echo "  install: https://go.dev/dl/";; \
          docker) echo "  install: https://docs.docker.com/get-docker/";; \
          kind)   echo "  install: https://kind.sigs.k8s.io/docs/user/quick-start/#installation";; \
        esac; \
        exit 1; \
      }; \
    done

  build-web:
    docker run --rm \
      -v "$(CURDIR)/web:/app" \
      -w /app \
      node:lts-alpine \
      sh -c "npm install --prefer-offline && npm run build"

  build-image:
    docker build -t $(IMAGE) .
    -kind load docker-image $(IMAGE) --name $(CLUSTER_NAME) 2>/dev/null || true

  demo: check-prereqs build-web build-image
    go run ./cmd/demo-ctl/
