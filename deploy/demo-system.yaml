---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-ctl
  namespace: demo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-ctl
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get, list, watch, delete]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get, post, put]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-ctl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-ctl
subjects:
  - kind: ServiceAccount
    name: demo-ctl
    namespace: demo-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-ctl
  namespace: demo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-ctl
  template:
    metadata:
      labels:
        app: demo-ctl
    spec:
      serviceAccountName: demo-ctl
      containers:
        - name: demo-ctl
          image: ghcr.io/schwarzm/neutron-operational-api:edge
          command: ["/demo-ctl"]
          env:
            - name: CONTROL_PLANE_URL
              value: "http://demo-ctl-svc.demo-system.svc.cluster.local:9090"
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: demo-ctl-svc
  namespace: demo-system
spec:
  selector:
    app: demo-ctl
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ctl
  namespace: demo-system
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~* /session/[^/]+/internal/ {
        return 403;
      }
spec:
  ingressClassName: nginx
  rules:
    - host: demo.n-o-d.c.eu-nl-1.cloud.sap
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-ctl-svc
                port:
                  number: 9090
